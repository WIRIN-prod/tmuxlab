image:
  repository: ghcr.io/wirin-prod/tmuxlab
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# The server token signs devices in. Leave both empty to have one generated into the volume (see NOTES).
token: ""
existingSecret: ""   # a Secret with key "token"

timezone: UTC

service:
  type: ClusterIP
  port: 7681

# Anyone holding a key gets a shell. Expose it only over HTTPS and only to people you trust.
ingress:
  enabled: false
  className: ""
  annotations: {}    # WebSockets must be allowed; raise proxy read timeouts for long-lived terminals
  host: tmuxlab.example.com
  tls: []            # - secretName: tmuxlab-tls

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  existingClaim: ""

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
