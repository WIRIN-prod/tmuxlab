{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tmuxlab.fullname" . }}
  labels: {{- include "tmuxlab.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }   # uninstalling never deletes your home folder
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.persistence.size }} } }
{{- end }}
