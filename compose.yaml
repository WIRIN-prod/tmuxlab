# docker compose up -d   then   docker compose logs tmuxlab   for your sign-in links.
# Use the machine's address, not the container's, e.g. http://192.168.1.20:7681/#token=…
services:
  tmuxlab:
    image: ghcr.io/wirin-prod/tmuxlab:latest
    # build: .                      # or build it from this folder
    restart: unless-stopped
    ports:
      - "7681:7681"                 # "127.0.0.1:7681:7681" to reach it only from this machine (e.g. behind tailscale serve)
    volumes:
      - home:/home/dev              # config, keys, repos, and tools you install; tmux sessions end when the container stops
    environment:
      TZ: UTC                       # schedules run in this time zone
      # TMUXLAB_TOKEN: change-me    # fixed server token; otherwise one is made and kept in the volume
volumes:
  home:
